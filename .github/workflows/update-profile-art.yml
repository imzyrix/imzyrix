name: Update profile art

# Refreshes the profile SVG art from real data every 5 minutes
# (the fastest GitHub Actions allows for a scheduled workflow),
# plus on-demand and whenever you push to main.

"on":
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py imzyrix contrib-heatmap.svg

      - name: Render activity report SVG (same data)
        run: python scripts/make_activity_svg.py

      - name: Fetch live Discord presence (Lanyard public API)
        env:
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python scripts/fetch_discord.py

      - name: Render Discord presence card SVG
        run: python scripts/make_discord_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json data/discord.json contrib-heatmap.svg activity.svg discord-presence.svg"
